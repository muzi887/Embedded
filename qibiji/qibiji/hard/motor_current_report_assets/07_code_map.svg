  <rect width="1950" height="1060" fill="#f7f6f1"/>
  <text x="54" y="55" font-family="Microsoft YaHei,Segoe UI,sans-serif"
    font-size="30" font-weight="700" fill="#1d2833">固件调用关系与数据流</text>
  <text x="54" y="87" font-family="Microsoft YaHei,Segoe UI,sans-serif"
    font-size="16" fill="#596773">静态分析基于当前工作区代码；函数均在主循环/定时器上下文执行</text>
  <line x1="54" y1="106" x2="1896" y2="106" stroke="#87949e"/>

    <g filter="url(#s)">
    <rect x="60" y="155" width="300" height="180" rx="12" fill="#ebeff2"
      stroke="#596773" stroke-width="2"/>
    <text x="76" y="186" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1d2833">main()</text>
    <text x="76" y="212"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">ADC1_Init()</text><text x="76" y="237"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">TIM2_Int_Init(7199, 50)</text><text x="76" y="262"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">while(1) AD_Process();</text><text x="76" y="287"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">while(1) Dcmotor_Process();</text>
  </g>
    <g filter="url(#s)">
    <rect x="440" y="155" width="350" height="225" rx="12" fill="#e4f0fa"
      stroke="#1c5f95" stroke-width="2"/>
    <text x="456" y="186" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1d2833">ADC1_Init()</text>
    <text x="456" y="212"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">GPIOC PC0–PC3 = AIN</text><text x="456" y="237"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">DMA1_CH1 circular</text><text x="456" y="262"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">ADC1 3-channel scan</text><text x="456" y="287"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">ADC clock 12 MHz</text><text x="456" y="312"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">calibration + start</text>
  </g>
    <g filter="url(#s)">
    <rect x="880" y="155" width="410" height="225" rx="12" fill="#e2f4f1"
