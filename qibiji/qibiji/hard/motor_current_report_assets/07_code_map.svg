    <text x="896" y="212"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">AD_Value[256][3]</text><text x="896" y="237"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">sum / N → raw_avg</text><text x="896" y="262"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">zero calibration</text><text x="896" y="287"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">sample_ma conversion</text><text x="896" y="312"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">25-entry FIFO average</text><text x="896" y="337"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">stall compare + counters</text>
  </g>
