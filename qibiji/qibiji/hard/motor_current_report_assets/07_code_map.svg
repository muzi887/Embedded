    <text x="896" y="557"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">EventPostMotorStall(sample_ma)</text><text x="896" y="582"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">→ motor_stall</text><text x="896" y="607"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">EventPostMotorStop(reason=stall)</text><text x="896" y="632"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">→ motor_stop</text><text x="896" y="657"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">PropertyReport_SetPending()</text>
  </g>
