      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">dcmotor_keycheck()</text><text x="456" y="607"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">dcmotor_ctrl()</text><text x="456" y="632"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">relay drive / stop event</text>
  </g>
    <g filter="url(#s)">
    <rect x="880" y="500" width="410" height="225" rx="12" fill="#fdeaea"
      stroke="#a83232" stroke-width="2"/>
    <text x="896" y="531" font-family="Microsoft YaHei,Segoe UI,sans-serif"
