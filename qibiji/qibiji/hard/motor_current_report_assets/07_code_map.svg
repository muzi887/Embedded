    <text x="1386" y="212"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">armReg.motor_curr (u16, mA)</text><text x="1386" y="237"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">g_adc_val[0] = motor_curr</text><text x="1386" y="262"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">s_current_zero_ready</text><text x="1386" y="287"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">pending_stop_reason = STALL</text>
  </g>
