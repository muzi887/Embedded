      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">property: /1000.0 → A</text><text x="1386" y="607"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">LCD threshold: /100</text><text x="1386" y="632"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">EEPROM address 0x0004</text>
  </g>
