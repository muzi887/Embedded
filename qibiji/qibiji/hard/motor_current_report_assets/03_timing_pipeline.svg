      <path d="M0 0 L10 5 L0 10 z" fill="#87949e"/>
    </marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5"
      orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#1c5f95"/>
    </marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5"
      orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#a83232"/>
    </marker>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1900" height="990" fill="#f7f6f1"/>
  <text x="54" y="55" font-family="Microsoft YaHei,Segoe UI,sans-serif"
    font-size="30" font-weight="700" fill="#1d2833">ADC / DMA / 软件滤波时序</text>
  <text x="54" y="87" font-family="Microsoft YaHei,Segoe UI,sans-serif"
    font-size="16" fill="#596773">连续硬件采样 + 20 ms 软件节拍；块平均窗口约 16.1 ms，长窗口再加 25 个 20 ms 样本</text>
  <line x1="54" y1="106" x2="1846" y2="106" stroke="#87949e"/>

    <g filter="url(#s)">
    <rect x="60" y="150" width="280" height="180" rx="12" fill="#e4f0fa"
      stroke="#1c5f95" stroke-width="2"/>
    <text x="76" y="181" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1d2833">系统时钟</text>
    <text x="76" y="207"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">HSE 8 MHz</text><text x="76" y="232"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">SYSCLK = 72 MHz</text><text x="76" y="257"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">TIM2 = 72 MHz</text><text x="76" y="282"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">ADC clock = 12 MHz</text>
  </g>
    <g filter="url(#s)">
    <rect x="385" y="150" width="300" height="180" rx="12" fill="#e2f4f1"
      stroke="#167269" stroke-width="2"/>
    <text x="401" y="181" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1d2833">ADC 顺序扫描</text>
    <text x="401" y="207"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">rank1: CH10 电流</text><text x="401" y="232"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">rank2: CH12 V_SUN</text><text x="401" y="257"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">rank3: CH13 +12V''</text><text x="401" y="282"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">239.5 cycles/sample</text>
  </g>
    <g filter="url(#s)">
    <rect x="730" y="150" width="310" height="180" rx="12" fill="#fff0d5"
      stroke="#a36409" stroke-width="2"/>
    <text x="746" y="181" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1d2833">单次序列估算</text>
    <text x="746" y="207"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">252 cycles / 12 MHz</text><text x="746" y="232"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">= 21 µs / channel</text><text x="746" y="257"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">≈ 63 µs / 3 channels</text><text x="746" y="282"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">连续循环转换</text>
  </g>
    <g filter="url(#s)">
    <rect x="1085" y="150" width="330" height="180" rx="12" fill="#f0e9f7"
      stroke="#664387" stroke-width="2"/>
    <text x="1101" y="181" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1d2833">DMA 循环缓冲</text>
    <text x="1101" y="207"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">AD_Value[256][3]</text><text x="1101" y="232"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">16 bit / 样本</text><text x="1101" y="257"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">256 × 3 × 63 µs</text><text x="1101" y="282"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">≈ 16.1 ms / 全缓冲</text>
  </g>
    <g filter="url(#s)">
    <rect x="1460" y="150" width="370" height="180" rx="12" fill="#fdeaea"
      stroke="#a83232" stroke-width="2"/>
    <text x="1476" y="181" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1d2833">20 ms 软件处理</text>
    <text x="1476" y="207"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">TIM2: 5 ms 中断</text><text x="1476" y="232"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">cnt%4=0 → flag20ms</text><text x="1476" y="257"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">主循环 AD_Process()</text><text x="1476" y="282"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">读取最近 256 行</text>
  </g>
    <g filter="url(#s)">
    <rect x="260" y="430" width="360" height="180" rx="12" fill="#fff0d5"
      stroke="#a36409" stroke-width="2"/>
    <text x="276" y="461" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1d2833">冷启动零点</text>
    <text x="276" y="487"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">电机必须 STOP</text><text x="276" y="512"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">累计 16 个 20 ms 样本</text><text x="276" y="537"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">≈ 320 ms 后 ready</text><text x="276" y="562"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">中途起动则清零重来</text>
  </g>
    <g filter="url(#s)">
    <rect x="730" y="430" width="360" height="180" rx="12" fill="#e2f4f1"
      stroke="#167269" stroke-width="2"/>
    <text x="746" y="461" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1d2833">单次样本转换</text>
    <text x="746" y="487"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">raw_avg = mean(CH10[0..255])</text><text x="746" y="512"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">Δ = max(raw_avg − zero_avg, 0)</text><text x="746" y="537"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">sample_ma = Δ × 8.057</text><text x="746" y="562"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">四舍五入到整数 mA</text>
  </g>
    <g filter="url(#s)">
    <rect x="1200" y="430" width="360" height="245" rx="12" fill="#e4f0fa"
      stroke="#1c5f95" stroke-width="2"/>
    <text x="1216" y="461" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1d2833">25 点 FIFO</text>
    <text x="1216" y="487"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">预校准的 16 个 0 已进入 FIFO</text><text x="1216" y="512"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">第 26 个全程样本开始更新</text><text x="1216" y="537"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">首次更新约在 ready 后 200 ms</text><text x="1216" y="562"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">完全排出旧 0 约需 500 ms</text><text x="1216" y="587"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">每 20 ms 覆盖 1 个样本</text>
  </g>
    <g filter="url(#s)">
    <rect x="730" y="710" width="830" height="160" rx="12" fill="#f0e9f7"
      stroke="#664387" stroke-width="2"/>
    <text x="746" y="741" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1d2833">零点慢跟踪</text>
    <text x="746" y="767"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">仅在“电机停止 ≥ 1 s”且“距上次跟踪 ≥ 1 s”时执行</text><text x="746" y="792"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">candidate = (15×zero_avg + raw_avg + 8) / 16</text><text x="746" y="817"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">每次最多只允许改变 1 个 ADC code。</text>
  </g>
