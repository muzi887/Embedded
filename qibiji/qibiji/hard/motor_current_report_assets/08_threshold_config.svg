<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="970" viewBox="0 0 1900 970">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5"
      orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#87949e"/>
    </marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5"
      orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#1c5f95"/>
    </marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5"
      orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#a83232"/>
    </marker>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1900" height="970" fill="#f7f6f1"/>
  <text x="54" y="55" font-family="Microsoft YaHei,Segoe UI,sans-serif"
    font-size="30" font-weight="700" fill="#1d2833">堵转阈值配置、保存与上电恢复</text>
  <text x="54" y="87" font-family="Microsoft YaHei,Segoe UI,sans-serif"
    font-size="16" fill="#596773">当前代码同时支持 LCD 和 4G 配置；单位统一为 mA，但 &lt;1000 mA 的上电迁移逻辑有风险</text>
  <line x1="54" y1="106" x2="1846" y2="106" stroke="#87949e"/>

    <g filter="url(#s)">
    <rect x="70" y="165" width="360" height="210" rx="12" fill="#e4f0fa"
      stroke="#1c5f95" stroke-width="2"/>
    <text x="86" y="196" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1d2833">LCD 设置</text>
    <text x="86" y="222"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">用户输入 4 位十进制约配置值</text><text x="86" y="247"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">threshold_ma = parsed × 100</text><text x="86" y="272"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">clamp ≤ 65535</text><text x="86" y="297"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">AT24CXX_WriteWord(0x0004)</text>
  </g>
    <g filter="url(#s)">
    <rect x="540" y="165" width="380" height="210" rx="12" fill="#f0e9f7"
      stroke="#664387" stroke-width="2"/>
    <text x="556" y="196" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1d2833">4G config.push</text>
    <text x="556" y="222"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">configCode = MotorMaxCurrConfig</text><text x="556" y="247"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">MotorMaxCurr: integer</text><text x="556" y="272"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">仅校验 0..65535</text><text x="556" y="297"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">直接写入 0x0004 + 回读</text>
  </g>
    <g filter="url(#s)">
    <rect x="1030" y="165" width="350" height="210" rx="12" fill="#fff0d5"
      stroke="#a36409" stroke-width="2"/>
    <text x="1046" y="196" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1d2833">EEPROM 0x0004</text>
    <text x="1046" y="222"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">u16 little-endian</text><text x="1046" y="247"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">单位：mA</text><text x="1046" y="272"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">默认 3500</text><text x="1046" y="297"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">地址属于参数 word index 2</text>
  </g>
    <g filter="url(#s)">
    <rect x="1470" y="165" width="360" height="210" rx="12" fill="#fdeaea"
      stroke="#a83232" stroke-width="2"/>
    <text x="1486" y="196" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1d2833">上电 eepromToPara()</text>
    <text x="1486" y="222"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">0 / 0xFFFF → 3500 mA</text><text x="1486" y="247"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">&lt;1000 → ×100（旧 0.1A 迁移）</text><text x="1486" y="272"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">≥1000 → 原值</text><text x="1486" y="297"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">不同则回写 EEPROM</text>
  </g>
    <g filter="url(#s)">
    <rect x="1030" y="540" width="800" height="190" rx="12" fill="#e2f4f1"
      stroke="#167269" stroke-width="2"/>
    <text x="1046" y="571" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1d2833">运行时阈值 armReg.motor_warning_curr_upper</text>
    <text x="1046" y="597"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">ADC 每个 20 ms 样本：sample_ma &gt; threshold</text><text x="1046" y="622"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">连续 10 次才停机；显示和协议读取同一寄存器。</text><text x="1046" y="647"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#596773">阈值改变立即作用于下一采样；无需复位。</text>
  </g>
    <path d="M250 375 L250 420 L1200 420 L1200 375"
      fill="none" stroke="#1c5f95" stroke-width="4" marker-end="url(#ab)"/>
    <path d="M730 375 L730 420"
      fill="none" stroke="#664387" stroke-width="4"/>
    <line x1="1380" y1="270" x2="1470" y2="270" stroke="#a36409"
    stroke-width="4" marker-end="url(#ar)"
    />
    <line x1="1650" y1="375" x2="1650" y2="470" stroke="#a83232"
    stroke-width="3" marker-end="url(#ar)"
    />
    <path d="M1650 470 L1430 470 L1430 540" fill="none" stroke="#a83232" stroke-width="3" marker-end="url(#ar)"/>
    <rect x="230" y="780" width="1450" height="72" rx="9"
      fill="#fdeaea" stroke="#a83232" stroke-width="1.5"/>
    <text x="245" y="808" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="16" font-weight="700" fill="#a83232">审核提示</text>
    <text x="245" y="834" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#596773">通过 4G 写入 1..999 mA 时，本次运行立即采用该值，但重启后会被迁移逻辑放大 100 倍。</text>
    <rect x="70" y="880" width="242" height="34" rx="17"
      fill="#e2f4f1" stroke="#167269" stroke-width="1.5"/>
    <text x="191" y="903" text-anchor="middle"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15"
      font-weight="600" fill="#167269">建议：只接受 1000..20000 mA</text>
    <rect x="550" y="880" width="192" height="34" rx="17"
      fill="#e4f0fa" stroke="#1c5f95" stroke-width="1.5"/>
    <text x="646" y="903" text-anchor="middle"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15"
      font-weight="600" fill="#1c5f95">或增加 EEPROM 单位版本号</text>
    <rect x="1040" y="880" width="142" height="34" rx="17"
      fill="#fff0d5" stroke="#a36409" stroke-width="1.5"/>
    <text x="1111" y="903" text-anchor="middle"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15"
      font-weight="600" fill="#a36409">保存时同时校验硬件量程</text>
  </svg>