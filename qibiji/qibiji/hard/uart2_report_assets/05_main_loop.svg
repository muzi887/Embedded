      <path d="M0 0 L10 5 L0 10 z" fill="#a93131"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1900" height="1080" fill="#f7f6f1"/>
  <text x="54" y="55" font-family="Microsoft YaHei,Segoe UI,sans-serif"
    font-size="30" font-weight="700" fill="#1e2933">主循环中的 UART2 执行顺序</text>
  <text x="54" y="87" font-family="Microsoft YaHei,Segoe UI,sans-serif"
    font-size="16" fill="#5c6874">Gprs_Process() 的顺序决定“先收后处理、先入队后发送、最后处理复位”</text>
  <line x1="54" y1="106" x2="1846" y2="106" stroke="#87949d"/>

    <g filter="url(#shadow)">
    <rect x="70" y="150" width="310" height="195" rx="12" fill="#ebeff2"
      stroke="#5c6874" stroke-width="2"/>
    <text x="86" y="181" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1e2933">main while(1)</text>
    <text x="86" y="208"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">喂看门狗</text><text x="86" y="233"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">sbf20_poll()</text><text x="86" y="258"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">近场 AT 序列若 busy → continue</text><text x="86" y="283"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">KEY / ADC / Motor / LCD</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="460" y="150" width="300" height="195" rx="12" fill="#e4f0fa"
      stroke="#1c5f95" stroke-width="2"/>
    <text x="476" y="181" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1e2933">属性上报</text>
    <text x="476" y="208"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">PropertyReport_Process()</text><text x="476" y="233"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">依赖上一轮 ready 状态</text><text x="476" y="258"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">开度变化 / 停止时上报</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="840" y="150" width="380" height="195" rx="12" fill="#e3f4f1"
      stroke="#1a7368" stroke-width="2"/>
    <text x="856" y="181" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1e2933">Gprs_Process()</text>
    <text x="856" y="208"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">gprs_rx_datas()</text><text x="856" y="233"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">Parse_Process()</text><text x="856" y="258"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">gprs_state_machine()</text><text x="856" y="283"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">周期对时 + 心跳 + 发送队列</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="1300" y="150" width="520" height="195" rx="12" fill="#f0e9f8"
      stroke="#654588" stroke-width="2"/>
    <text x="1316" y="181" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1e2933">主循环尾部</text>
    <text x="1316" y="208"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">Gprs_ClockSync_Process()</text><text x="1316" y="233"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">Gprs_Reset_Process()</text><text x="1316" y="258"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">Eeprom_Wpara()</text><text x="1316" y="283"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">manage485()</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="420" y="470" width="460" height="250" rx="12" fill="#fff0d4"
      stroke="#a3650b" stroke-width="2"/>
    <text x="436" y="501" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1e2933">近场 AT 独占分支</text>
    <text x="436" y="528"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">if (uart3_at_sequence_main_loop_tick())</text><text x="436" y="553"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">    continue;</text><text x="436" y="578"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">普通 KEY/ADC/Motor/LCD/GPRS 全部跳过</text><text x="436" y="603"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">仍每圈喂 IWDG</text><text x="436" y="628"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">23 条 AT 完成后模块复位 + MCU 复位</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="990" y="470" width="410" height="250" rx="12" fill="#fdeaea"
      stroke="#a93131" stroke-width="2"/>
    <text x="1006" y="501" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1e2933">Gprs_Process 顺序</text>
    <text x="1006" y="528"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">1 接收并搬入帧队列</text><text x="1006" y="553"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">2 解析 JSON / AT</text><text x="1006" y="578"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">3 推进链路状态机</text><text x="1006" y="603"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">4 对时调度</text><text x="1006" y="628"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">5 心跳探活</text><text x="1006" y="653"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">6 发送队列 → 对时超时 → 延时复位</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="560" y="820" width="1000" height="110" rx="12" fill="#ffffff"
      stroke="#87949d" stroke-width="2"/>
    <text x="576" y="851" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1e2933">副作用</text>
    <text x="576" y="878"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15"
      fill="#5c6874">ReSet 回执先入队；至少 1 s 且队列清空（或最多 6 s）后才执行 NVIC_SystemReset。</text>
  </g>
    <line x1="380" y1="245" x2="460" y2="245" stroke="#ebeff2"
    stroke-width="4" marker-end="url(#arrow)"
    />
    <line x1="760" y1="245" x2="840" y2="245" stroke="#1c5f95"
    stroke-width="4" marker-end="url(#arrowBlue)"
    />
    <line x1="1220" y1="245" x2="1300" y2="245" stroke="#1a7368"
    stroke-width="4" marker-end="url(#arrow)"
    />
    <path d="M220 345 L220 410 L430 410 L430 470"
      fill="none" stroke="#a3650b" stroke-width="3" marker-end="url(#arrowRed)"/>
    <rect x="90" y="990" width="180" height="34" rx="17"
      fill="#e4f0fa" stroke="#1a7368" stroke-width="1.5"/>
    <text x="180" y="1013" text-anchor="middle"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15"
      font-weight="600" fill="#1a7368">UART2 接收在业务处理之前</text>
    <rect x="490" y="990" width="120" height="34" rx="17"
      fill="#e4f0fa" stroke="#1c5f95" stroke-width="1.5"/>
    <text x="550" y="1013" text-anchor="middle"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15"
      font-weight="600" fill="#1c5f95">发送在状态推进之后</text>
    <rect x="890" y="990" width="210" height="34" rx="17"
      fill="#fff0d4" stroke="#a3650b" stroke-width="1.5"/>
    <text x="995" y="1013" text-anchor="middle"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15"
      font-weight="600" fill="#a3650b">ReSet 是延时复位，不是立即复位</text>
  </svg>