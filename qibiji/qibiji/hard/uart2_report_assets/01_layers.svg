    <text x="456" y="208"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">USART2 IDLE 中断</text><text x="456" y="233"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">DMA1_Channel6 接收</text><text x="456" y="258"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">DMA_Rece_Buf2[1024]</text><text x="456" y="283"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">发送：轮询 TC，阻塞式</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="860" y="150" width="390" height="205" rx="12" fill="#e3f4f1"
      stroke="#1a7368" stroke-width="2"/>
