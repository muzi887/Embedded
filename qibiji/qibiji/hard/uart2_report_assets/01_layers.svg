      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">3072 字节线性缓冲</text><text x="876" y="258"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">8 × 1023 字节接收帧队列</text><text x="876" y="283"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">8 项 AT/JSON 发送队列</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="1330" y="150" width="510" height="205" rx="12" fill="#f0e9f8"
