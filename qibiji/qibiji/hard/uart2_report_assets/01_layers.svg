    <text x="76" y="181" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1e2933">物理层</text>
    <text x="76" y="208"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">PA2 → Q2 → U30 AT_RXD</text><text x="76" y="233"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">PA3 ← Q1 ← U30 AT_TXD</text><text x="76" y="258"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">115200 8N1</text><text x="76" y="283"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">无硬件流控</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="440" y="150" width="340" height="205" rx="12" fill="#e4f0fa"
