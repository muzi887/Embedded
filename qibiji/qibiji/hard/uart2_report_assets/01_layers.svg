  <rect width="1900" height="1050" fill="#f7f6f1"/>
  <text x="54" y="55" font-family="Microsoft YaHei,Segoe UI,sans-serif"
    font-size="30" font-weight="700" fill="#1e2933">UART2 分层功能总览</text>
  <text x="54" y="87" font-family="Microsoft YaHei,Segoe UI,sans-serif"
    font-size="16" fill="#5c6874">MCU USART2 不是单一串口驱动，而是 4G 模块的 AT + 主题化 JSON 通信子系统</text>
  <line x1="54" y1="106" x2="1846" y2="106" stroke="#87949d"/>

    <g filter="url(#shadow)">
    <rect x="60" y="150" width="300" height="205" rx="12" fill="#fff0d4"
