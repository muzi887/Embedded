  <rect width="1950" height="1070" fill="#f7f6f1"/>
  <text x="54" y="55" font-family="Microsoft YaHei,Segoe UI,sans-serif"
    font-size="30" font-weight="700" fill="#1e2933">正常模式 UART2 接收链</text>
  <text x="54" y="87" font-family="Microsoft YaHei,Segoe UI,sans-serif"
    font-size="16" fill="#5c6874">DMA 收到物理字节后，由 IDLE 中断、双槽暂存、环形缓冲和帧队列逐层转交主循环</text>
  <line x1="54" y1="106" x2="1896" y2="106" stroke="#87949d"/>

    <g filter="url(#shadow)">
