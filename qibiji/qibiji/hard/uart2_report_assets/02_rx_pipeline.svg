      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">115200 8N1</text><text x="66" y="258"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">空闲帧由模块 UARTFT 切分</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="385" y="150" width="330" height="205" rx="12" fill="#e4f0fa"
