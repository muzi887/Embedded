    <text x="401" y="208"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">Normal 模式</text><text x="401" y="233"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">最多 1024 字节/次</text><text x="401" y="258"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">BuffSize = DMA_Rec2_Len</text><text x="401" y="283"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">内存地址递增</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="770" y="150" width="335" height="205" rx="12" fill="#e3f4f1"
      stroke="#1a7368" stroke-width="2"/>
    <text x="786" y="181" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1e2933">USART2 IDLE IRQ</text>
    <text x="786" y="208"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">读取 DR 清 IDLE</text><text x="786" y="233"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">len = 1024 − DMA_CNDTR</text><text x="786" y="258"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">复制整帧到乒乓槽</text><text x="786" y="283"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">重新装载 DMA</text>
  </g>
