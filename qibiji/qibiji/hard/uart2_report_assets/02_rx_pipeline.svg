      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">仅主循环访问</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="830" y="500" width="390" height="230" rx="12" fill="#e3f4f1"
