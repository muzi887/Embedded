    <text x="376" y="903"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">LINKA 低 ≥2000 ms：确认掉线</text><text x="376" y="928"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">LINKA 高 ≥500 ms：确认恢复</text><text x="376" y="953"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">短抖动不改变状态机</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="1030" y="845" width="530" height="160" rx="12" fill="#e4f0fa"
