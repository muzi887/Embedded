  <text x="54" y="87" font-family="Microsoft YaHei,Segoe UI,sans-serif"
    font-size="16" fill="#5c6874">LINKA 去抖、模块 banner、三条 AT 查询和失败退避共同决定何时允许业务报文</text>
  <line x1="54" y1="106" x2="1896" y2="106" stroke="#87949d"/>

    <g filter="url(#shadow)">
    <rect x="70" y="160" width="330" height="210" rx="12" fill="#fdeaea"
