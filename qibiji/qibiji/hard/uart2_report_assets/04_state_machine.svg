    <text x="1146" y="603"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">最多 3 轮初始化均失败</text><text x="1146" y="628"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">30 min 后再重试状态2</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="360" y="845" width="540" height="160" rx="12" fill="#f0e9f8"
