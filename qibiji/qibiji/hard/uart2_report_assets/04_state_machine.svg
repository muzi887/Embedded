      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">重连：link_down_occurred</text><text x="1046" y="953"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">两者还需 link_state = 1</text>
  </g>
