    <text x="706" y="603"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">累计失败次数 &lt; 3</text><text x="706" y="628"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16"
      fill="#5c6874">10 s 后重新进入状态2</text>
  </g>
    <g filter="url(#shadow)">
