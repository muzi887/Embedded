<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1850" height="1040" viewBox="0 0 1850 1040">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5"
      orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#84919b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5"
      orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5f99"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1850" height="1040" fill="#f7f6f1"/>
  <text x="56" y="58" font-family="Microsoft YaHei,Segoe UI,sans-serif"
    font-size="30" font-weight="700" fill="#1f2933">高边输出、蜂鸣器、按键与 LCD</text>
  <text x="56" y="90" font-family="Microsoft YaHei,Segoe UI,sans-serif"
    font-size="16" fill="#59636e">控制电平均为 MCU 3.3 V；高边开关和 LCD 背光属于直接 GPIO 控制</text>
  <line x1="56" y1="108" x2="1794" y2="108" stroke="#84919b" stroke-width="1"/>

    <g filter="url(#shadow)">
    <rect x="70" y="170" width="320" height="220" rx="12"
      fill="#e4f0fa" stroke="#1f5f99" stroke-width="2"/>
    <text x="86" y="201" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1f2933">MCU 控制</text>
    <text x="86" y="226"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">PD5 / pin 86: V02_CTRL</text><text x="86" y="250"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">PD4 / pin 85: V01_CTRL</text><text x="86" y="274"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">PD0 / pin 81: BEEP</text><text x="86" y="298"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">PA0 / pin 23: LCD backlight</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="520" y="150" width="360" height="260" rx="12"
      fill="#fff0d4" stroke="#a36108" stroke-width="2"/>
    <text x="536" y="181" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1f2933">12 V 高边输出</text>
    <text x="536" y="206"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">1 kΩ → Q12/Q14 base</text><text x="536" y="230"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">10 kΩ base pull-down</text><text x="536" y="254"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">100 kΩ gate pull-up to 12 V</text><text x="536" y="278"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">Q11/Q13: ES4407 P-MOS</text><text x="536" y="302"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">F4/F5: 1.1 A PTC</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="1050" y="150" width="300" height="260" rx="12"
      fill="#e1f5f2" stroke="#087f7b" stroke-width="2"/>
    <text x="1066" y="181" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1f2933">现场端子</text>
    <text x="1066" y="206"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">V02 → CN6..CN11 pin 3</text><text x="1066" y="230"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">V01 → CN2 pin 4</text><text x="1066" y="254"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">控制高电平 = ON</text><text x="1066" y="278"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">控制低电平 = OFF</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="1470" y="150" width="315" height="260" rx="12"
      fill="#e5f3e8" stroke="#2e6b3c" stroke-width="2"/>
    <text x="1486" y="181" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1f2933">蜂鸣器</text>
    <text x="1486" y="206"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">PD0 → R82 1 kΩ</text><text x="1486" y="230"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">Q15 MMBT5551</text><text x="1486" y="254"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">5 V 有源蜂鸣器 PZ1</text><text x="1486" y="278"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">高电平鸣叫</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="70" y="540" width="550" height="300" rx="12"
      fill="#ffffff" stroke="#84919b" stroke-width="2"/>
    <text x="86" y="571" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1f2933">按键 K1_UP..K5_CANL</text>
    <text x="86" y="596"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">K6..K3 / K? TC-1103 实体键</text><text x="86" y="620"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">4.7 kΩ 上拉到 3.3 V</text><text x="86" y="644"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">按下 = LOW</text><text x="86" y="668"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">100 nF 并联去抖</text><text x="86" y="692"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">GPIO: PD15/PA15/PA11/PA12/PC9</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="710" y="540" width="545" height="300" rx="12"
      fill="#efe9f7" stroke="#65458b" stroke-width="2"/>
    <text x="726" y="571" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1f2933">LCD HS12864</text>
    <text x="726" y="596"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">PSB 经 R93 0 Ω 接地 = 串行模式</text><text x="726" y="620"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">CS → PE3 / SID → PE4 / SCLK → PE5</text><text x="726" y="644"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">VDD 3.3 V；背光 A 5 V</text><text x="726" y="668"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">LEDK 由 Q16 SI2302 拉低</text><text x="726" y="692"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">PA0 经 R94/R95 控制背光</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="1340" y="540" width="445" height="300" rx="12"
      fill="#e5f3e8" stroke="#2e6b3c" stroke-width="2"/>
    <text x="1356" y="571" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1f2933">状态指示</text>
    <text x="1356" y="596"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">LED_4G → Q4 → LED2</text><text x="1356" y="620"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">LED_ERR → Q17 → LED1</text><text x="1356" y="644"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">LED_UP → Q18 → LED4</text><text x="1356" y="668"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">LED_DN → Q19 → LED5</text><text x="1356" y="692"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">均高电平点亮</text>
  </g>
    <line x1="390" y1="250" x2="520" y2="250"
    stroke="#1f5f99" stroke-width="4"
    
    marker-end="url(#arrow)"/>
    <line x1="880" y1="290" x2="1050" y2="290"
    stroke="#a36108" stroke-width="4"
    
    marker-end="url(#arrow)"/>
    <line x1="390" y1="380" x2="710" y2="650"
    stroke="#65458b" stroke-width="3"
    stroke-dasharray="9 7"
    marker-end="url(#arrow)"/>
    <g><rect x="100" y="930" width="192" height="32" rx="16"
      fill="#efe9f7" stroke="#65458b" stroke-width="1.5"/>
    <text x="196" y="952" text-anchor="middle"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14"
      font-weight="600" fill="#65458b">Q16 为 N-MOS 低边背光开关</text></g>
    <g><rect x="510" y="930" width="201" height="32" rx="16"
      fill="#fdeaea" stroke="#aa2d2d" stroke-width="1.5"/>
    <text x="610.5" y="952" text-anchor="middle"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14"
      font-weight="600" fill="#aa2d2d">K5_CANL = 按键，不是 CAN</text></g>
    <g><rect x="890" y="930" width="174" height="32" rx="16"
      fill="#e5f3e8" stroke="#2e6b3c" stroke-width="1.5"/>
    <text x="977" y="952" text-anchor="middle"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14"
      font-weight="600" fill="#2e6b3c">LCD 串行模式，非并行 MPU</text></g>
  </svg>