<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="960" viewBox="0 0 1900 960">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5"
      orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#84919b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5"
      orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5f99"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1900" height="960" fill="#f7f6f1"/>
  <text x="56" y="58" font-family="Microsoft YaHei,Segoe UI,sans-serif"
    font-size="30" font-weight="700" fill="#1f2933">模拟测量链与 ADC 换算</text>
  <text x="56" y="90" font-family="Microsoft YaHei,Segoe UI,sans-serif"
    font-size="16" fill="#59636e">ADC 参考接 VDDA；ADC12/13 经 LM358 缓冲，ADC10 为削比后的电机电流信号</text>
  <line x1="56" y1="108" x2="1844" y2="108" stroke="#84919b" stroke-width="1"/>

    <g filter="url(#shadow)">
    <rect x="70" y="180" width="360" height="160" rx="12"
      fill="#fff0d4" stroke="#a36108" stroke-width="2"/>
    <text x="86" y="211" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1f2933">V_SUN 采样</text>
    <text x="86" y="236"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">R36 100 kΩ / R39 10 kΩ</text><text x="86" y="260"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">除以 11</text><text x="86" y="284"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">U6A 缓冲 → ADC12</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="70" y="390" width="360" height="160" rx="12"
      fill="#fff0d4" stroke="#a36108" stroke-width="2"/>
    <text x="86" y="421" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1f2933">+12V'' 采样</text>
    <text x="86" y="446"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">R34 100 kΩ / R35 10 kΩ</text><text x="86" y="470"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">除以 11</text><text x="86" y="494"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">U6B 缓冲 → ADC13</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="70" y="600" width="360" height="160" rx="12"
      fill="#fdeaea" stroke="#aa2d2d" stroke-width="2"/>
    <text x="86" y="631" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1f2933">电机电流 I-V_MO</text>
    <text x="86" y="656"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">R43 50 mΩ 电流取样</text><text x="86" y="680"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">R23 10 kΩ / R22 20 kΩ</text><text x="86" y="704"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">×2/3 → U4A ×3 → ADC10</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="620" y="365" width="460" height="240" rx="12"
      fill="#e5f3e8" stroke="#2e6b3c" stroke-width="2"/>
    <text x="636" y="396" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1f2933">LM358 模拟前端</text>
    <text x="636" y="421"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">+5 V 供电、单电源</text><text x="636" y="445"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">ADC12: V_SUN / 11</text><text x="636" y="469"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">ADC13: +12V'' / 11</text><text x="636" y="493"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">ADC10: 2 × V_shunt</text><text x="636" y="517"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">总增益 = (2/3) × 3</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="1280" y="290" width="480" height="330" rx="12"
      fill="#e4f0fa" stroke="#1f5f99" stroke-width="2"/>
    <text x="1296" y="321" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1f2933">STM32 ADC</text>
    <text x="1296" y="346"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">PC2 / pin 17: ADC12</text><text x="1296" y="370"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">PC3 / pin 18: ADC13</text><text x="1296" y="394"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">PC0 / pin 15: ADC10</text><text x="1296" y="418"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">PC1 / pin 16: ADC11</text><text x="1296" y="442"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">VREF+ = VDDA（3.3 V）</text><text x="1296" y="466"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">VREF- = VSSA/AGND</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="620" y="660" width="1140" height="120" rx="12"
      fill="#ffffff" stroke="#84919b" stroke-width="2"/>
    <text x="636" y="691" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1f2933">估算公式</text>
    <text x="636" y="716"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">V_ADC12 = V_SUN / 11；V_ADC13 ≈ +12V'' / 11；V_ADC10 = 0.050 × I_MO × 2</text><text x="636" y="740"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">例：I_MO = 2 A → V_ADC10 = 200 mV → 12-bit/3.3 V 约 248 counts（未计偏移与误差）</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="620" y="175" width="620" height="150" rx="12"
      fill="#fdeaea" stroke="#aa2d2d" stroke-width="2"/>
    <text x="636" y="206" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1f2933">ADC11 / I-V_SUN 网络不完整</text>
    <text x="636" y="231"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">PDF 显示 I-V_SUN → R20 → U4B，R19 到地。</text><text x="636" y="255"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">但 .NET 中 R20 仅有引脚 2 属 NetR19_2，</text><text x="636" y="279"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">没有 I-V_SUN 的另一端连接；需核查测量源。</text>
  </g>
    <line x1="430" y1="260" x2="620" y2="430"
    stroke="#a36108" stroke-width="4"
    
    marker-end="url(#arrow)"/>
    <line x1="430" y1="470" x2="620" y2="470"
    stroke="#a36108" stroke-width="4"
    
    marker-end="url(#arrow)"/>
    <line x1="430" y1="680" x2="620" y2="610"
    stroke="#aa2d2d" stroke-width="4"
    
    marker-end="url(#arrow)"/>
    <line x1="1080" y1="440" x2="1280" y2="440"
    stroke="#2e6b3c" stroke-width="4"
    
    marker-end="url(#arrow)"/>
    <g><rect x="1260" y="850" width="246" height="32" rx="16"
      fill="#fff0d4" stroke="#a36108" stroke-width="1.5"/>
    <text x="1383" y="872" text-anchor="middle"
      font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14"
      font-weight="600" fill="#a36108">ADC 精度受 3.3 V LDO 与地噪声影响</text></g>
  </svg>