<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5"
      orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#84919b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5"
      orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5f99"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1800" height="1050" fill="#f7f6f1"/>
  <text x="56" y="58" font-family="Microsoft YaHei,Segoe UI,sans-serif"
    font-size="30" font-weight="700" fill="#1f2933">4G Cat-1 通信与复位链路</text>
  <text x="56" y="90" font-family="Microsoft YaHei,Segoe UI,sans-serif"
    font-size="16" fill="#59636e">UART2 使用 MMBT5551 双向电平转换；模块逻辑域由 V_PAD_3V0 提供</text>
  <line x1="56" y1="108" x2="1744" y2="108" stroke="#84919b" stroke-width="1"/>

    <g filter="url(#shadow)">
    <rect x="70" y="175" width="320" height="265" rx="12"
      fill="#e4f0fa" stroke="#1f5f99" stroke-width="2"/>
    <text x="86" y="206" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1f2933">STM32F103</text>
    <text x="86" y="231"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">PA2 / pin 25: UART2_TX</text><text x="86" y="255"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">PA3 / pin 26: UART2_RX</text><text x="86" y="279"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">PC5 / pin 34: LINKA</text><text x="86" y="303"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">PC4 / pin 33: LINKB</text><text x="86" y="327"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">PA1 / pin 24: 4G reset control</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="565" y="160" width="405" height="340" rx="12"
      fill="#e5f3e8" stroke="#2e6b3c" stroke-width="2"/>
    <text x="581" y="191" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1f2933">UART 电平转换</text>
    <text x="581" y="216"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">Q2: MCU TX → AT_RXD</text><text x="581" y="240"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">R7 4.7 kΩ 上拉到 3.3 V</text><text x="581" y="264"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">R6 10 kΩ 到 V_PAD_3V0</text><text x="581" y="288"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">Q1: AT_TXD → MCU RX</text><text x="581" y="312"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">R3 4.7 kΩ 上拉到 3.3 V</text><text x="581" y="336"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">TX / RX 路径均反相后抵消</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="1140" y="155" width="520" height="340" rx="12"
      fill="#efe9f7" stroke="#65458b" stroke-width="2"/>
    <text x="1156" y="186" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1f2933">U30 WH-LTE-7S1</text>
    <text x="1156" y="211"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">pin 16: +3.8 V 主电源</text><text x="1156" y="235"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">pin 5: V_PAD_3V0 输出域</text><text x="1156" y="259"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">pin 7: AT_RXD / pin 6: AT_TXD</text><text x="1156" y="283"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">pin 1/2: LINKA / LINKB</text><text x="1156" y="307"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">pin 19: RESET（低有效）</text><text x="1156" y="331"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">pin 18: VCAP + C76 100 nF</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="565" y="610" width="405" height="230" rx="12"
      fill="#fff0d4" stroke="#a36108" stroke-width="2"/>
    <text x="581" y="641" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1f2933">复位反相</text>
    <text x="581" y="666"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">PA1 high → Q3 ON → RESET low</text><text x="581" y="690"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">R13 100 kΩ 上拉到 V_PAD</text><text x="581" y="714"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">C6 100 nF 到地</text><text x="581" y="738"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">复位释放时间常数约 10 ms</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="1140" y="610" width="520" height="230" rx="12"
      fill="#eceef0" stroke="#59636e" stroke-width="2"/>
    <text x="1156" y="641" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="20" font-weight="700" fill="#1f2933">无线相关占位/未用资源</text>
    <text x="1156" y="666"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">SIM_RST / CLK / DATA / VDD：无外部 SIM 网络</text><text x="1156" y="690"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">USB_DM / USB_DP / VBUS：未连接</text><text x="1156" y="714"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">POWERKEY / WORK / LED_NET：未连接</text><text x="1156" y="738"
      font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="15" fill="#59636e">RF1 中心脚仅看到单端标签 RF-ANT</text>
  </g>
    <line x1="390" y1="280" x2="565" y2="280"
    stroke="#1f5f99" stroke-width="4"
    
    marker-end="url(#arrow)"/>
    <line x1="390" y1="345" x2="565" y2="345"
    stroke="#1f5f99" stroke-width="4"
    
    marker-end="url(#arrow)"/>
    <line x1="970" y1="280" x2="1140" y2="280"
    stroke="#2e6b3c" stroke-width="4"
    
    marker-end="url(#arrow)"/>
    <line x1="970" y1="345" x2="1140" y2="345"
    stroke="#2e6b3c" stroke-width="4"
    
    marker-end="url(#arrow)"/>
    <line x1="390" y1="390" x2="1140" y2="390"
    stroke="#65458b" stroke-width="3"
