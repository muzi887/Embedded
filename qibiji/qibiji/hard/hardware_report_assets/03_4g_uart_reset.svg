    <text x="84" y="913" font-family="Microsoft YaHei,Segoe UI,sans-serif"
      font-size="14" fill="#59636e">必须回到原始 Altium/PCB 核查 RF1 pin 5 是否与 U30 天线焊盘实际相连；现有 PDF 只有一个 RF-ANT 标签，.NET 中也没有包含该中心脚的二端网络。</text></g>
  </svg>